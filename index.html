<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>MariBank</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #eeeeee;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}


/* =================================
   MOBILE APP CONTAINER
================================= */

.app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    background: #ffffff;
    position: relative;
    overflow: hidden;
}


/* =================================
   MAIN AUTH SCREEN
================================= */

.auth-container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    padding: 0 31px;
}


/* =================================
   LOGO
================================= */

.logo {
    text-align: center;
    padding-top: 84px;
}

.logo img {
    width: 170px;
    height: auto;
}

.logo-text {
    display: inline-flex;
    align-items: center;
    gap: 7px;
}

.logo-symbol {
    width: 35px;
    height: 35px;
    border: 3px solid #f15a00;
    border-radius: 50%;
    color: #f15a00;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    font-weight: bold;
    position: relative;
}

.logo-symbol::after {
    content: "";
    position: absolute;
    width: 29px;
    height: 6px;
    border-bottom: 3px solid #0074d9;
    border-radius: 50%;
    bottom: -7px;
    left: 1px;
}

.logo-name {
    color: #f15a00;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: -1px;
}


/* =================================
   LOGIN AREA
================================= */

.login-area {
    margin-top: 76px;
}

.login-title {
    text-align: center;
    color: #222222;
    font-size: 13px;
    font-weight: normal;
    margin-bottom: 10px;
}


/* =================================
   BUTTONS
================================= */

button {
    font-family: Arial, Helvetica, sans-serif;
}

.shopee-button {
    width: 100%;
    height: 40px;
    border: none;
    border-radius: 7px;
    background: #f15a00;
    color: white;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.shopee-icon {
    position: absolute;
    left: 13px;
    font-size: 17px;
}

.shopee-button:hover {
    background: #df5000;
}


/* =================================
   OR DIVIDER
================================= */

.or-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0;
}

.or-divider::before,
.or-divider::after {
    content: "";
    height: 1px;
    background: #eeeeee;
    flex: 1;
}

.or-divider span {
    color: #888888;
    font-size: 10px;
}


/* =================================
   MOBILE SIGN UP
================================= */

.mobile-button {
    width: 100%;
    height: 40px;
    border-radius: 7px;
    border: 1px solid #ff7043;
    background: #ffffff;
    color: #f15a00;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.mobile-icon {
    position: absolute;
    left: 13px;
    font-size: 15px;
}

.mobile-button:hover {
    background: #fff7f3;
}


/* =================================
   APPLE BUTTON
================================= */

.apple-button {
    width: 100%;
    height: 40px;
    border-radius: 7px;
    border: 1px solid #333333;
    background: #ffffff;
    color: #444444;
    font-size: 11px;
    cursor: pointer;
    margin-top: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.apple-icon {
    position: absolute;
    left: 13px;
    color: #000000;
    font-size: 17px;
}

.apple-button:hover {
    background: #f8f8f8;
}


/* =================================
   BOTTOM LOGIN
================================= */

.bottom-login {
    margin-top: auto;
    padding-bottom: 20px;
    text-align: center;
    font-size: 11px;
    color: #222222;
}

.bottom-login button {
    border: none;
    background: none;
    color: #0066cc;
    font-size: 11px;
    cursor: pointer;
    padding-left: 3px;
}


/* =================================
   LOGIN FORM
================================= */

.form-page {
    display: none;
    min-height: 100vh;
    background: #ffffff;
    padding: 0 31px;
}

.form-logo {
    text-align: center;
    padding-top: 84px;
    margin-bottom: 55px;
}

.form-title {
    text-align: center;
    font-size: 20px;
    color: #222222;
    margin-bottom: 8px;
}

.form-subtitle {
    text-align: center;
    color: #777777;
    font-size: 12px;
    margin-bottom: 28px;
}


/* =================================
   INPUTS
================================= */

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #333333;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    height: 43px;
    padding: 0 13px;
    border: 1px solid #d8d8d8;
    border-radius: 7px;
    outline: none;
    font-size: 13px;
    color: #222222;
}

.input-group input:focus {
    border-color: #f15a00;
    box-shadow: 0 0 0 2px rgba(241, 90, 0, 0.08);
}


/* =================================
   FORM BUTTON
================================= */

.main-button {
    width: 100%;
    height: 43px;
    border: none;
    border-radius: 7px;
    background: #f15a00;
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.main-button:hover {
    background: #df5000;
}

.main-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}


/* =================================
   FORM SWITCH
================================= */

.switch-text {
    text-align: center;
    margin-top: 20px;
    color: #777777;
    font-size: 11px;
}

.switch-text button {
    border: none;
    background: none;
    color: #0066cc;
    cursor: pointer;
    font-size: 11px;
}


/* =================================
   MESSAGE
================================= */

.message {
    display: none;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 15px;
    font-size: 11px;
    text-align: center;
}

.error {
    background: #fff0f0;
    color: #c62828;
    border: 1px solid #ffd5d5;
}

.success {
    background: #eaf8ef;
    color: #087f3e;
    border: 1px solid #c8ead5;
}


/* =================================
   DASHBOARD
================================= */

.dashboard {
    display: none;
    min-height: 100vh;
    background: #f7f7f7;
}

.topbar {
    height: 60px;
    background: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #eeeeee;
}

.topbar-logo {
    color: #f15a00;
    font-size: 20px;
    font-weight: bold;
}

.logout-button {
    border: none;
    background: #fff0eb;
    color: #e64d00;
    padding: 8px 13px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
}

.dashboard-content {
    padding: 50px 20px;
    text-align: center;
}

.dashboard-content h2 {
    color: #222222;
    font-size: 21px;
}

.dashboard-content p {
    color: #777777;
    margin-top: 10px;
    font-size: 12px;
}


/* =================================
   SMALL SCREEN
================================= */

@media (max-width: 380px) {

    .auth-container,
    .form-page {
        padding-left: 25px;
        padding-right: 25px;
    }

    .logo {
        padding-top: 70px;
    }

    .login-area {
        margin-top: 60px;
    }

}

</style>
</head>


<body>


<div class="app">


<!-- =================================
     MAIN START SCREEN
================================= -->

<div class="auth-container" id="authContainer">


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-text">

            <div class="logo-symbol">
                M
            </div>

            <div class="logo-name">
                MariBank
            </div>

        </div>

    </div>


    <!-- START OPTIONS -->

    <div class="login-area">

        <p class="login-title">
            Start your MariBank journey
        </p>


        <!-- SHOPEE -->

        <button
            class="shopee-button"
            onclick="continueShopee()"
        >

            <span class="shopee-icon">
                🛍
            </span>

            Continue with Shopee

        </button>


        <!-- OR -->

        <div class="or-divider">
            <span>OR</span>
        </div>


        <!-- MOBILE NUMBER -->

        <button
            class="mobile-button"
            onclick="showSignup()"
        >

            <span class="mobile-icon">
                ▣
            </span>

            Sign up with mobile number

        </button>


        <!-- APPLE -->

        <button
            class="apple-button"
            onclick="continueApple()"
        >

            <span class="apple-icon">
                ●
            </span>

            Continue with Apple

        </button>

    </div>


    <!-- BOTTOM LOGIN -->

    <div class="bottom-login">

        Already have an account?

        <button onclick="showLogin()">
            Login
        </button>

    </div>

</div>



<!-- =================================
     LOGIN PAGE
================================= -->

<div
    class="form-page"
    id="loginPage"
>

    <div class="form-logo">

        <div class="logo-text">

            <div class="logo-symbol">
                M
            </div>

            <div class="logo-name">
                MariBank
            </div>

        </div>

    </div>


    <h2 class="form-title">
        Welcome back
    </h2>

    <p class="form-subtitle">
        Log in to your account
    </p>


    <div
        id="loginMessage"
        class="message"
    ></div>


    <div class="input-group">

        <label>
            Username
        </label>

        <input
            type="text"
            id="loginUsername"
            placeholder="Enter username"
        >

    </div>


    <div class="input-group">

        <label>
            Password
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
        >

    </div>


    <button
        class="main-button"
        id="loginBtn"
        onclick="login()"
    >
        Login
    </button>


    <div class="switch-text">

        Don't have an account?

        <button onclick="showSignup()">
            Sign Up
        </button>

    </div>


</div>



<!-- =================================
     SIGNUP PAGE
================================= -->

<div
    class="form-page"
    id="signupPage"
>

    <div class="form-logo">

        <div class="logo-text">

            <div class="logo-symbol">
                M
            </div>

            <div class="logo-name">
                MariBank
            </div>

        </div>

    </div>


    <h2 class="form-title">
        Create an account
    </h2>

    <p class="form-subtitle">
        Create your account
    </p>


    <div
        id="signupMessage"
        class="message"
    ></div>


    <div class="input-group">

        <label>
            Username
        </label>

        <input
            type="text"
            id="signupUsername"
            placeholder="Choose a username"
        >

    </div>


    <div class="input-group">

        <label>
            Password
        </label>

        <input
            type="password"
            id="signupPassword"
            placeholder="At least 8 characters"
        >

    </div>


    <div class="input-group">

        <label>
            Confirm Password
        </label>

        <input
            type="password"
            id="signupConfirmPassword"
            placeholder="Repeat password"
        >

    </div>


    <button
        class="main-button"
        id="signupBtn"
        onclick="signup()"
    >
        Create Account
    </button>


    <div class="switch-text">

        Already have an account?

        <button onclick="showLogin()">
            Login
        </button>

    </div>

</div>



<!-- =================================
     DASHBOARD
================================= -->

<div
    class="dashboard"
    id="dashboard"
>

    <div class="topbar">

        <div class="topbar-logo">
            MariBank
        </div>

        <button
            class="logout-button"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <div class="dashboard-content">

        <h2 id="welcomeName">
            Welcome!
        </h2>

        <p>
            You're logged in to the application.
        </p>

    </div>

</div>


</div>



<script>


/* =================================
   APPS SCRIPT API
================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwvUYfirvmjndCOsOZmX3OxFFJobA9zVawNwHDGEvRaWGhUq9xS40YTI_pBJMGKezBa/exec";



/* =================================
   SHOW SIGNUP
================================= */

function showSignup() {

    document.getElementById("authContainer")
        .style.display = "none";

    document.getElementById("loginPage")
        .style.display = "none";

    document.getElementById("signupPage")
        .style.display = "block";

}



/* =================================
   SHOW LOGIN
================================= */

function showLogin() {

    document.getElementById("authContainer")
        .style.display = "none";

    document.getElementById("signupPage")
        .style.display = "none";

    document.getElementById("loginPage")
        .style.display = "block";

}



/* =================================
   BACK TO START
================================= */

function showStart() {

    document.getElementById("loginPage")
        .style.display = "none";

    document.getElementById("signupPage")
        .style.display = "none";

    document.getElementById("authContainer")
        .style.display = "flex";

}



/* =================================
   MESSAGE
================================= */

function showMessage(
    element,
    text,
    type
) {

    element.textContent = text;

    element.className =
        "message " + type;

    element.style.display =
        "block";

}



/* =================================
   API
================================= */

async function callApi(
    action,
    payload
) {

    const response =
        await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify({
                        action: action,
                        ...payload
                    })
            }
        );


    const text =
        await response.text();

    let result = {};


    try {

        result =
            text
            ? JSON.parse(text)
            : {};

    } catch (error) {

        throw new Error(
            text ||
            "Server return an invalid response."
        );

    }


    if (!response.ok) {

        throw new Error(
            result.message ||
            `Request failed with status ${res.status}`
        );

    }


    return result;

}



/* =================================
   SIGNUP
================================= */

async function signup() {

    const username =
        document
            .getElementById(
                "signupUsername"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "signupPassword"
            )
            .value;

    const confirmPassword =
        document
            .getElementById(
                "signupConfirmPassword"
            )
            .value;

    const message =
        document.getElementById(
            "signupMessage"
        );

    const button =
        document.getElementById(
            "signupBtn"
        );


    message.style.display =
        "none";


    if (
        !username ||
        !password ||
        !confirmPassword
    ) {

        showMessage(
            message,
            "Please fill in all fields.",
            "error"
        );

        return;

    }


    if (
        password !==
        confirmPassword
    ) {

        showMessage(
            message,
            "Passwords do not match.",
            "error"
        );

        return;

    }


    if (password.length < 8) {

        showMessage(
            message,
            "Password must be at least 8 characters.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Creating account...";


    try {

        const result =
            await callApi(
                "signup",
                {
                    username,
                    password
                }
            );


        showMessage(
            message,
            result.message,
            result.success
                ? "success"
                : "error"
        );


        if (result.success) {

            setTimeout(
                () => {

                    document.getElementById(
                        "signupUsername"
                    ).value = "";

                    document.getElementById(
                        "signupPassword"
                    ).value = "";

                    document.getElementById(
                        "signupConfirmPassword"
                    ).value = "";

                    showLogin();

                },
                1200
            );

        }


    } catch (error) {

        showMessage(
            message,
            error.message ||
            "Network error.",
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "Create Account";

}



/* =================================
   LOGIN
================================= */

async function login() {

    const username =
        document
            .getElementById(
                "loginUsername"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;

    const message =
        document.getElementById(
            "loginMessage"
        );

    const button =
        document.getElementById(
            "loginBtn"
        );


    message.style.display =
        "none";


    if (!username || !password) {

        showMessage(
            message,
            "Please enter your username and password.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Logging in...";


    try {

        const result =
            await callApi(
                "login",
                {
                    username,
                    password
                }
            );


        if (result.success) {

            document.getElementById(
                "loginPage"
            ).style.display =
                "none";


            document.getElementById(
                "dashboard"
            ).style.display =
                "block";


            document.getElementById(
                "welcomeName"
            ).textContent =
                "Welcome, " +
                result.username +
                "!";

        } else {

            showMessage(
                message,
                result.message,
                "error"
            );

        }


    } catch (error) {

        showMessage(
            message,
            error.message ||
            "Network error.",
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "Login";

}



/* =================================
   LOGOUT
================================= */

function logout() {

    document.getElementById(
        "dashboard"
    ).style.display =
        "none";


    document.getElementById(
        "authContainer"
    ).style.display =
        "flex";


    document.getElementById(
        "loginUsername"
    ).value = "";

    document.getElementById(
        "loginPassword"
    ).value = "";

}



/* =================================
   SHOPEE BUTTON
================================= */

function continueShopee() {

    alert(
        "Shopee login is for processing."
    );

}



/* =================================
   APPLE BUTTON
================================= */

function continueApple() {

    alert(
        "Apple login is for processing."
    );

}

</script>

</body>
</html>
